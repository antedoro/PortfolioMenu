{{define "navbar"}}
<nav class="bg-white dark:bg-gray-800 shadow mb-6 rounded-xl overflow-hidden mx-auto max-w-7xl">
  <div class="flex justify-between items-center px-6 py-4">
    <div class="flex items-center gap-6">
      <div class="font-bold text-xl flex items-center gap-3">
        <img src="/icon.png" class="w-8 h-8 rounded-lg shadow-sm">
        PortfolioMenu
      </div>
      <div class="flex gap-4 border-l pl-6 border-gray-200 dark:border-gray-700">
        <a href="/" class="hover:text-blue-500 {{if eq .CurrentPage "dashboard"}}text-blue-600 dark:text-blue-400 font-semibold{{end}}">Dashboard</a>
        <a href="/config" class="hover:text-blue-500 {{if eq .CurrentPage "config"}}text-blue-600 dark:text-blue-400 font-semibold{{end}}">Configurazione</a>
        <a href="/about" class="hover:text-blue-500 {{if eq .CurrentPage "about"}}text-blue-600 dark:text-blue-400 font-semibold{{end}}">About</a>
      </div>
    </div>
    <div class="flex gap-3 items-center">
      <button onclick="toggleDark()" class="px-3 py-1 rounded bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition">🌙</button>
    </div>
  </div>
</nav>

<script>
function toggleDark(){
  document.documentElement.classList.toggle('dark');
  let isDark = document.documentElement.classList.contains('dark');
  fetch('/api/settings', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'dark_mode=' + isDark
  });
}
</script>
{{end}}
